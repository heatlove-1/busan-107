<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{font-family:Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Segoe UI",Roboto,sans-serif;
background:#eef0f3;color:#16181d;font-size:15px;line-height:1.45;-webkit-text-size-adjust:100%}
.wrap{max-width:780px;margin:0 auto;background:#fff;min-height:100vh;box-shadow:0 0 0 1px #e3e6ea}
a{color:inherit}
.sticky{position:sticky;top:0;z-index:30;background:#fff}
header.hd{background:#0a3d7a;color:#fff;padding:14px 14px 12px;padding-top:calc(14px + env(safe-area-inset-top))}
.hd-top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.hd-sub{font-size:12px;color:#a8c6e8;letter-spacing:.2px}
.hd h1{margin:2px 0 0;font-size:19px;font-weight:800;letter-spacing:-.3px}
.dday{background:#fff;color:#0a3d7a;border-radius:8px;padding:6px 10px;font-weight:800;font-size:15px;white-space:nowrap;text-align:center;line-height:1.1}
.dday small{display:block;font-size:10px;font-weight:600;color:#5a7ea8}
.hd-meta{margin-top:10px;display:flex;gap:6px;flex-wrap:wrap}
.hd-meta span{background:rgba(255,255,255,.14);border-radius:6px;padding:3px 8px;font-size:11.5px;color:#dce9f7}
nav.tabs{display:flex;border-bottom:1px solid #e3e6ea;background:#fff}
nav.tabs button{flex:1;border:0;background:none;padding:12px 4px 10px;font-size:14.5px;font-weight:700;color:#8a9099;
cursor:pointer;border-bottom:2.5px solid transparent;font-family:inherit}
nav.tabs button.on{color:#0a3d7a;border-bottom-color:#0a3d7a}
nav.tabs button .cnt{display:block;font-size:10.5px;font-weight:600;color:#a7adb6;margin-top:1px}
nav.tabs button.on .cnt{color:#5a87bd}
.tools{border-bottom:1px solid #e3e6ea;background:#fff;padding-bottom:2px}
.chips{display:flex;gap:6px;overflow-x:auto;padding:8px 12px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;border:1px solid #d6dae0;background:#fff;color:#454b54;border-radius:999px;
padding:6px 11px;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;white-space:nowrap}
.chip.on{background:#0a3d7a;border-color:#0a3d7a;color:#fff}
.chip.today{border-color:#0a3d7a;color:#0a3d7a}
.chip.on.today{color:#fff}
.srow{display:flex;gap:6px;padding:0 12px 8px}
.srow input,.srow select{flex:1;min-width:0;border:1px solid #d6dae0;border-radius:8px;padding:8px 10px;
font-size:14px;font-family:inherit;background:#fff;color:#16181d}
.srow select{flex:0 0 118px}
.srow input:focus,.srow select:focus{outline:2px solid #bcd3ee;outline-offset:-1px}
.btn-fav{flex:0 0 auto;border:1px solid #d6dae0;background:#fff;border-radius:8px;padding:0 11px;font-size:13px;
font-weight:700;color:#454b54;cursor:pointer;font-family:inherit}
.btn-fav.on{background:#fff6e0;border-color:#e8b54a;color:#8a5a00}
.dayhd{display:flex;align-items:baseline;gap:8px;padding:14px 14px 6px;background:#fff}
.dayhd b{font-size:15.5px;color:#0a3d7a}
.dayhd .dn{font-size:12px;color:#8a9099}
.dayhd .warn{font-size:11.5px;color:#b4541a;background:#fdf1e7;border-radius:5px;padding:2px 7px}
.card{position:relative;border:1px solid #e3e6ea;border-radius:10px;margin:0 12px 8px;padding:10px 12px;background:#fff}
.card.cancel{background:#fafafa}
.card.cancel .ttl{text-decoration:line-through;color:#9aa0a8}
.r1{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-bottom:3px}
.time{font-weight:800;font-size:14px;color:#0a3d7a;font-variant-numeric:tabular-nums}
.bdg{font-size:11px;font-weight:700;border-radius:5px;padding:2px 6px;background:#eef2f7;color:#4c6party}
.bdg{background:#eef2f7;color:#456089}
.bdg.g{background:#e9f4ec;color:#246b3a}
.bdg.r{background:#fdeaea;color:#b23434}
.bdg.y{background:#fdf3e0;color:#8a5a00}
.ttl{font-size:15px;font-weight:700;letter-spacing:-.2px;padding-right:26px}
.meta{font-size:13px;color:#555b63;margin-top:3px;display:flex;gap:6px}
.meta i{font-style:normal;color:#9aa0a8;flex:0 0 34px;font-size:12px;padding-top:1px}
.vbtn{display:inline-block;margin-top:7px;border:1px solid #d6dae0;background:#f7f9fb;border-radius:7px;
padding:5px 9px;font-size:12.5px;font-weight:600;color:#2c4d7a;cursor:pointer;font-family:inherit;text-align:left}
.vbtn.away{background:#fdf3e0;border-color:#e8c88a;color:#8a5a00}
.star{position:absolute;top:6px;right:6px;border:0;background:none;font-size:20px;color:#d8dde3;cursor:pointer;
padding:4px 6px;line-height:1}
.star.on{color:#f0a71e}
.empty{margin:12px;padding:22px 16px;border:1px dashed #cfd5dc;border-radius:10px;text-align:center;color:#79808a;font-size:13.5px}
.notice{margin:10px 12px;border:1px solid #e8c88a;background:#fdf8ee;border-radius:10px;padding:11px 13px;font-size:13px;color:#6b4d16}
.notice b{color:#8a5a00}
.notice code{background:#f3e9d2;border-radius:4px;padding:1px 5px;font-size:12px}
.mapsec{margin-top:16px;border-top:8px solid #eef0f3;padding-bottom:30px}
.mapsec h2{margin:0;padding:14px 14px 2px;font-size:16px}
.mapsec p.sub{margin:0;padding:0 14px 8px;font-size:12.5px;color:#8a9099}
.mapbox{margin:0 12px 10px;border:1px solid #d6dae0;border-radius:10px;overflow:hidden;background:#eef0f3}
.mapbox iframe{display:block;width:100%;height:230px;border:0}
.vcard{border:1px solid #e3e6ea;border-radius:10px;margin:0 12px 8px;padding:10px 12px}
.vcard .vn{font-size:14.5px;font-weight:700}
.vcard .vm{font-size:12.5px;color:#79808a;margin-top:2px}
.vcard .acts{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.vcard .acts a,.vcard .acts button{flex:1;min-width:92px;text-align:center;text-decoration:none;border:1px solid #d6dae0;
border-radius:7px;padding:7px 6px;font-size:12.5px;font-weight:700;color:#2c4d7a;background:#f7f9fb;cursor:pointer;font-family:inherit}
.vcard .acts a.kakao{background:#fef3c7;border-color:#e8d08a;color:#6b5311}
.fab{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom));
background:#0a3d7a;color:#fff;border:0;border-radius:999px;padding:12px 20px;font-size:14px;font-weight:700;
box-shadow:0 4px 14px rgba(10,61,122,.35);cursor:pointer;z-index:40;font-family:inherit}
footer{padding:16px 14px 40px;font-size:11.5px;color:#9aa0a8;text-align:center;line-height:1.6}
@media (prefers-color-scheme:dark){
body{background:#15171a;color:#e8eaed}
.wrap{background:#1b1e22;box-shadow:none}
.sticky,nav.tabs,.tools,.dayhd,.card,.vcard{background:#1b1e22;border-color:#2e3238}
nav.tabs button.on{color:#8ab4f8;border-bottom-color:#8ab4f8}

var DOWK = ['일','월','화','수','목','금','토'];
function esc(v){
  if (v === null || v === undefined) return '';
  return String(v).replace(/[&<>"]/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];
  });
}
function iso2d(s){
  var p = String(s).split('-');
  return new Date(+p[0], +p[1] - 1, +p[2]);
}
function fmtD(s){
  if (!s) return '';
  var d = iso2d(s);
  return (d.getMonth() + 1) + '.' + d.getDate() + '.(' + DOWK[d.getDay()] + ')';
}
function todayISO(){
  var d = new Date();
  var m = String(d.getMonth() + 1).padStart(2, '0');
  var dd = String(d.getDate()).padStart(2, '0');
  return d.getFullYear() + '-' + m + '-' + dd;
}
var TODAY = todayISO();

var FAVKEY = 'b107.fav';
var FAV = {};
try {
  FAV = JSON.parse(localStorage.getItem(FAVKEY) || '{}');
} catch (e) {
  FAV = {};
}
function toggleFav(id){
  if (FAV[id]) {
    delete FAV[id];
  } else {
    FAV[id] = 1;
  }
  try {
    localStorage.setItem(FAVKEY, JSON.stringify(FAV));
  } catch (e) {}
}

var S = {
  tab: 'ops',
  gdate: D.dates.indexOf(TODAY) >= 0 ? TODAY : 'all',
  sport: 'all',
  venue: 'all',
  q: '',
  fav: false,
  ocat: 'all',
  grp: 'A',
  vfil: 'all'
};

/* ---------- 헤더 ---------- */
function initHeader(){
  var el = document.getElementById('dday');
  var diff = Math.round((iso2d(D.open) - iso2d(TODAY)) / 86400000);
  var txt, lab = '개회까지';
  if (diff > 0) {
    txt = 'D-' + diff;
  } else if (diff === 0) {
    txt = 'D-DAY';
    lab = '오늘 개회';
  } else {
    var ed = Math.round((iso2d(D.close) - iso2d(TODAY)) / 86400000);
    if (ed >= 0) {
      txt = (-diff + 1) + '일차';
      lab = '대회 진행중';
    } else {
      txt = '종료';
      lab = '대회';
    }
  }
  el.innerHTML = '<small>' + lab + '</small>' + txt;
  document.getElementById('m-games').textContent = '경기 ' + D.games.length + '건';
  document.getElementById('m-venues').textContent = '경기장 ' + D.venues.filter(function(v){ return v.kind === '경기장'; }).length + '곳';
  document.getElementById('upd').textContent = D.updated;
}

/* ---------- 탭 ---------- */
function renderTabs(){
  var defs = [
    ['ops', '운영 일정', D.ops.length + '건'],
    ['games', '경기 일정', D.games.length + '건'],
    ['grp', '조별 일정', D.groupPlans.length ? D.groupPlans.length + '건' : 'A~E조']
  ];
  document.getElementById('tabs').innerHTML = defs.map(function(t){
    return '<button data-tab="' + t[0] + '" class="' + (S.tab === t[0] ? 'on' : '') + '">' +
      t[1] + '<span class="cnt">' + t[2] + '</span></button>';
  }).join('');
}

/* ---------- 툴바 ---------- */
function renderTools(){
  var h = '';
  if (S.tab === 'games') {
    h += '<div class="chips">';
    h += '<button class="chip ' + (S.gdate === 'all' ? 'on' : '') + '" data-gd="all">전체</button>';
    D.dates.forEach(function(dt){
      var on = S.gdate === dt ? 'on' : '';
      var td = dt === TODAY ? 'today' : '';
      var lab = D.day[dt] + '일차 ' + fmtD(dt).replace(/\.\(/, '(');
      h += '<button class="chip ' + on + ' ' + td + '" data-gd="' + dt + '">' + lab + '</button>';
    });
    h += '</div><div class="srow">';
    h += '<input id="q" type="search" placeholder="선수·학교·종목·경기장 검색" value="' + esc(S.q) + '">';
    h += '<select id="sp"><option value="all">전체 종목</option>' + D.sports.map(function(s){
      return '<option value="' + esc(s) + '"' + (S.sport === s ? ' selected' : '') + '>' + esc(s) + '</option>';
    }).join('') + '</select>';
    h += '<button class="btn-fav ' + (S.fav ? 'on' : '') + '" data-act="fav">★</button>';
    h += '</div>';
    if (S.venue !== 'all') {
      h += '<div class="srow"><button class="chip on" data-act="clearvenue">경기장: ' + esc(S.venue) + ' ✕</button></div>';
    }
  } else if (S.tab === 'ops') {
    var cats = ['all', '주요일정', '사전경기'];
    h += '<div class="chips">' + cats.map(function(c){
      return '<button class="chip ' + (S.ocat === c ? 'on' : '') + '" data-oc="' + c + '">' +
        (c === 'all' ? '전체' : c) + '</button>';
    }).join('') + '</div>';
    h += '<div class="srow"><input id="q" type="search" placeholder="일정·장소·대상 검색" value="' + esc(S.q) + '"></div>';
  } else {
    h += '<div class="chips">' + ['A', 'B', 'C', 'D', 'E'].map(function(c){
      return '<button class="chip ' + (S.grp === c ? 'on' : '') + '" data-gp="' + c + '">' + c + '조</button>';
    }).join('') + '</div>';
  }
  document.getElementById('tools').innerHTML = h;
}

/* ---------- 운영 일정 ---------- */
function opCard(o){
  var cls = 'card' + (o.status === '취소' ? ' cancel' : '');
  var h = '<div class="' + cls + '">';
  h += '<div class="r1"><span class="time">' + esc(o.time || '시간 미정') + '</span>';
  h += '<span class="bdg' + (o.cat === '사전경기' ? ' g' : '') + '">' + esc(o.cat) + '</span>';
  if (o.status === '취소') h += '<span class="bdg r">취소</span>';
  if (o.groups.length === 5) {
    h += '<span class="bdg y">전 조</span>';
  } else if (o.groups.length) {
    h += '<span class="bdg y">' + o.groups.join('·') + '조</span>';
  }
  h += '</div>';
  h += '<div class="ttl">' + esc(o.title) + '</div>';
  if (o.cat === '사전경기' && o.end && o.end !== o.date) {
    h += '<div class="meta"><i>기간</i><span>' + fmtD(o.date) + ' ~ ' + fmtD(o.end) + '</span></div>';
  }
  if (o.who) h += '<div class="meta"><i>대상</i><span>' + esc(o.who) + '</span></div>';
  if (o.note) h += '<div class="meta"><i>비고</i><span>' + esc(o.note) + '</span></div>';
  if (o.place) h += '<button class="vbtn" data-map="' + esc(o.place) + '">' + esc(o.place) + '</button>';
  h += '</div>';
  return h;
}
function renderOps(){
  var q = S.q.trim().toLowerCase();
  var list = D.ops.filter(function(o){
    if (S.ocat !== 'all' && o.cat !== S.ocat) return false;
    if (!q) return true;
    return (o.title + ' ' + o.place + ' ' + o.who + ' ' + o.note).toLowerCase().indexOf(q) >= 0;
  });
  if (!list.length) return '<div class="empty">조건에 맞는 운영 일정이 없습니다.</div>';
  var out = '', cur = '';
  list.forEach(function(o){
    if (o.date !== cur) {
      cur = o.date;
      var dn = o.daynote ? '<span class="warn">' + esc(o.daynote) + '</span>' : '';
      var td = o.date === TODAY ? '<span class="dn">오늘</span>' : '';
      out += '<div class="dayhd"><b>' + fmtD(o.date) + '</b>' + td + dn + '</div>';
    }
    out += opCard(o);
  });
  return out;
}

/* ---------- 경기 일정 ---------- */
function gameCard(g){
  var on = FAV[g.id] ? ' on' : '';
  var h = '<div class="card">';
  h += '<button class="star' + on + '" data-fav="' + g.id + '">★</button>';
  h += '<div class="r1"><span class="time">' + esc(g.time) + '</span>';
  h += '<span class="bdg">' + esc(g.sport) + ' · ' + esc(g.div) + '</span></div>';
  h += '<div class="ttl">' + esc(g.event) + '</div>';
  if (g.team) h += '<div class="meta"><i>출전</i><span>' + esc(g.team) + '</span></div>';
  if (g.opp) h += '<div class="meta"><i>상대</i><span>' + esc(g.opp) + '</span></div>';
  var away = isAway(g.venue);
  h += '<button class="vbtn' + (away ? ' away' : '') + '" data-map="' + esc(g.venue) + '">' +
    esc(g.venue) + (away ? ' · 제주 외' : '') + '</button>';
  h += '</div>';
  return h;
}
var AWAYSET = {};
D.venues.forEach(function(v){ if (v.away) AWAYSET[v.name] = 1; });
function isAway(n){ return !!AWAYSET[n]; }

function renderGames(){
  var q = S.q.trim().toLowerCase();
  var list = D.games.filter(function(g){
    if (S.gdate !== 'all' && g.date !== S.gdate) return false;
    if (S.sport !== 'all' && g.sport !== S.sport) return false;
    if (S.venue !== 'all' && g.venue !== S.venue) return false;
    if (S.fav && !FAV[g.id]) return false;
    if (!q) return true;
    return (g.sport + ' ' + g.event + ' ' + g.team + ' ' + g.opp + ' ' + g.venue).toLowerCase().indexOf(q) >= 0;
  });
  if (!list.length) {
    return '<div class="empty">조건에 맞는 경기가 없습니다.<br>필터를 해제해 보세요.</div>';
  }
  var out = '', cur = '';
  list.forEach(function(g){
    if (g.date !== cur) {
      cur = g.date;
      var td = g.date === TODAY ? '<span class="dn">오늘</span>' : '';
      var n = list.filter(function(x){ return x.date === cur; }).length;
      out += '<div class="dayhd"><b>' + D.day[g.date] + '일차 · ' + fmtD(g.date) + '</b>' + td +
        '<span class="dn">' + n + '경기</span></div>';
    }
    out += gameCard(g);
  });
  return out;
}

/* ---------- 조별 일정 ---------- */
function renderGrp(){
  var out = '';
  if (!D.groupPlans.length) {
    out += '<div class="notice"><b>조별 일정 원본이 비어 있습니다.</b><br>' +
      '업로드하신 <code>조별 일정.csv</code>는 머리글(day, date, group, route, note)만 있고 내용이 없습니다. ' +
      '내용을 채워 다시 주시면 이 탭에 그대로 넣겠습니다.<br>아래 목록은 <b>운영 일정의 참석 대상에서 ' +
      S.grp + '조에 해당하는 항목만 자동 추출</b>한 것입니다.</div>';
  }
  var list = D.ops.filter(function(o){ return o.groups.indexOf(S.grp) >= 0; });
  if (!list.length) return out + '<div class="empty">' + S.grp + '조 해당 일정이 없습니다.</div>';
  var cur = '';
  list.forEach(function(o){
    if (o.date !== cur) {
      cur = o.date;
      out += '<div class="dayhd"><b>' + fmtD(o.date) + '</b></div>';
    }
    out += opCard(o);
  });
  return out;

  document.getElementById('vchips').innerHTML = fils.map(function(f){

  });
  document.getElementById('vlist').innerHTML = list.map(function(v){
    var h = '<div class="vcard"><div class="vn">' + esc(v.name) +

      encodeURIComponent(v.name) + '">네이버지도</a>';
    if (v.kind === '경기장') {
      h += '<button data-vgo="' + esc(v.name) + '">경기 보기</button>';
    }
    h += '</div></div>';
    return h;
  }).join('');

    v.innerHTML = renderOps();
  } else if (S.tab === 'games') {
    v.innerHTML = renderGames();
  } else {
    v.innerHTML = renderGrp();
  }
  renderVenues();
}

/* ---------- 이벤트 ---------- */
document.addEventListener('click', function(e){
  var t = e.target.closest('[data-tab],[data-gd],[data-oc],[data-gp],[data-vf],[data-fav],[data-map],[data-vgo],[data-act]');
  if (!t) return;
  if (t.dataset.tab) {
    S.tab = t.dataset.tab;
    S.q = '';
    render();
    window.scrollTo(0, 0);
  } else if (t.dataset.gd) {
    S.gdate = t.dataset.gd;
    render();
  } else if (t.dataset.oc) {
    S.ocat = t.dataset.oc;
    render();
  } else if (t.dataset.gp) {
    S.grp = t.dataset.gp;
    render();
  } else if (t.dataset.vf) {
    S.vfil = t.dataset.vf;
    renderVenues();
  } else if (t.dataset.fav) {
    toggleFav(t.dataset.fav);
    t.classList.toggle('on');
  } else if (t.dataset.map) {
    window.open('https://map.kakao.com/?q=' + encodeURIComponent(t.dataset.map), '_blank');
  } else if (t.dataset.vgo) {
    S.tab = 'games';
    S.venue = t.dataset.vgo;
    S.gdate = 'all';
    S.sport = 'all';
    S.fav = false;
    render();
    window.scrollTo(0, 0);
  } else if (t.dataset.act === 'fav') {
    S.fav = !S.fav;
    render();
  } else if (t.dataset.act === 'clearvenue') {
    S.venue = 'all';
    render();
  }
});
document.addEventListener('input', function(e){
  if (e.target.id === 'q') {
    S.q = e.target.value;
    var v = document.getElementById('view');
    v.innerHTML = S.tab === 'ops' ? renderOps() : renderGames();
  }
});
document.addEventListener('change', function(e){
  if (e.target.id === 'sp') {
    S.sport = e.target.value;
    render();
  }
});
document.getElementById('fab').addEventListener('click', function(){
  document.getElementById('mapsec').scrollIntoView({ behavior: 'smooth' });
});
