<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<meta name="theme-color" content="#0f2350">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>제107회 전국체육대회 · 부산광역시 선수단</title>
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Crect width='180' height='180' rx='40' fill='%230f2350'/%3E%3Ctext x='90' y='84' font-size='54' font-weight='700' fill='%23fff' text-anchor='middle' font-family='sans-serif'%3E107%3C/text%3E%3Ctext x='90' y='130' font-size='34' fill='%237aa2ff' text-anchor='middle' font-family='sans-serif'%3E부산%3C/text%3E%3C/svg%3E">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --navy:#0f2350; --navy2:#1b335f; --pri:#1b4dd8; --pri-s:#eaf0ff;
  --bg:#f5f6f8; --card:#fff; --line:#e6e8ec; --line2:#eff1f4;
  --fg:#15181d; --mut:#6b7280; --mut2:#9aa1ad;
  --warn:#b45309; --warn-bg:#fffbeb; --warn-line:#fde68a;
  --dang:#b91c1c; --ok:#047857;
  --r:14px;
  --safe-b:env(safe-area-inset-bottom,0px);
}
html,body{margin:0;padding:0}
body{
  font-family:Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  background:var(--bg); color:var(--fg); font-size:15px; line-height:1.5;
  -webkit-font-smoothing:antialiased; letter-spacing:-.01em;
  padding-bottom:calc(72px + var(--safe-b));
}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;letter-spacing:-.01em}
a{color:inherit;text-decoration:none}

/* ===== app bar ===== */
.bar{position:sticky;top:0;z-index:40;background:var(--navy);color:#fff;padding:calc(10px + env(safe-area-inset-top,0px)) 16px 0}
.bar .t1{font-size:11px;letter-spacing:.08em;color:#8fabe8;font-weight:600}
.bar .t2{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:2px;padding-bottom:10px}
.bar h1{margin:0;font-size:17px;font-weight:700;letter-spacing:-.02em}
.dday{flex:none;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.18);
  border-radius:999px;padding:4px 11px;font-size:12px;font-weight:700;color:#dbe6ff}
.dday b{color:#fff}

/* ===== tabs ===== */
.tabs{position:sticky;top:0;z-index:39;display:flex;background:var(--navy);padding:0 10px}
.tabs button{flex:1;padding:11px 0 12px;font-size:14px;font-weight:600;color:#8fabe8;position:relative}
.tabs button.on{color:#fff}
.tabs button.on::after{content:"";position:absolute;left:14%;right:14%;bottom:0;height:3px;background:#fff;border-radius:3px 3px 0 0}
.tabs .nb{display:inline-block;margin-left:5px;font-size:11px;font-weight:700;color:#7d9ae0}
.tabs button.on .nb{color:#c9d9ff}

/* ===== sticky filter zone ===== */
.sticky{position:sticky;top:44px;z-index:38;background:var(--bg);
  border-bottom:1px solid var(--line);padding:10px 0 8px}
.row{display:flex;gap:6px;overflow-x:auto;padding:0 14px;scrollbar-width:none}
.row::-webkit-scrollbar{display:none}
.row+.row{margin-top:7px}
.chip{flex:none;border:1px solid var(--line);background:var(--card);border-radius:999px;
  padding:7px 13px;font-size:13px;font-weight:600;color:#44505f;white-space:nowrap;display:flex;align-items:center;gap:5px}
.chip .n{font-size:11px;color:var(--mut2);font-weight:700}
.chip.on{background:var(--navy);border-color:var(--navy);color:#fff}
.chip.on .n{color:#a9c0f5}
.seg{display:flex;gap:4px;margin:0 14px;background:#eceef2;border-radius:10px;padding:3px}
.seg button{flex:1;padding:7px 0;font-size:13px;font-weight:600;color:#5b6675;border-radius:8px}
.seg button.on{background:#fff;color:var(--fg);box-shadow:0 1px 2px rgba(16,24,40,.06)}
.srch{margin:7px 14px 0;display:flex;align-items:center;gap:7px;background:var(--card);
  border:1px solid var(--line);border-radius:10px;padding:8px 11px}
.srch input{flex:1;border:0;outline:0;font-size:14px;background:none;color:var(--fg);min-width:0}
.srch svg{flex:none;opacity:.42}
.srch .clr{font-size:17px;color:var(--mut2);padding:0 2px;line-height:1}

/* ===== layout ===== */
.wrap{padding:12px 14px 0}
.sechd{display:flex;align-items:baseline;justify-content:space-between;margin:16px 2px 8px}
.sechd:first-child{margin-top:4px}
.sechd h2{margin:0;font-size:13px;font-weight:700;color:#3d4756;letter-spacing:-.01em}
.sechd span{font-size:11.5px;color:var(--mut2);font-weight:600}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.card+.card{margin-top:9px}
.empty{text-align:center;color:var(--mut2);font-size:13.5px;padding:46px 20px;
  background:var(--card);border:1px solid var(--line);border-radius:var(--r)}

/* date group header */
.dhd{display:flex;align-items:center;gap:8px;margin:18px 2px 8px}
.dhd b{font-size:14px;font-weight:700}
.dhd .dw{font-size:11.5px;font-weight:700;color:#fff;background:#8893a4;border-radius:5px;padding:1px 6px}
.dhd .dw.sat{background:#2563eb}.dhd .dw.sun{background:#dc2626}
.dhd .ln{flex:1;height:1px;background:var(--line)}
.dhd .cnt{font-size:11.5px;color:var(--mut2);font-weight:600}
.warnbox{display:flex;gap:7px;background:var(--warn-bg);border:1px solid var(--warn-line);
  border-radius:10px;padding:8px 11px;font-size:12.5px;color:var(--warn);font-weight:600;margin:0 0 9px}

/* ===== ops item ===== */
.op{display:flex;gap:11px;padding:12px 13px;border-bottom:1px solid var(--line2);align-items:flex-start}
.op:last-child{border-bottom:0}
.op .tm{flex:none;width:52px;text-align:right;font-size:12px;font-weight:700;color:var(--pri);
  font-variant-numeric:tabular-nums;padding-top:1px;line-height:1.35}
.op .tm small{display:block;font-weight:600;color:var(--mut2);font-size:11px}
.op .bd{flex:1;min-width:0}
.op .ti{font-size:14.5px;font-weight:700;letter-spacing:-.015em}
.op .pl{font-size:12.5px;color:var(--mut);margin-top:2px}
.op .mt{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.tag{font-size:11px;font-weight:700;border-radius:5px;padding:2px 6px;background:#f1f3f6;color:#53606f}
.tag.who{background:var(--pri-s);color:#1b45b8}
.tag.nt{background:#fff7ed;color:#9a5b0a}
.op.off .ti{text-decoration:line-through;color:var(--mut2)}
.tag.cx{background:#fef2f2;color:var(--dang)}

/* ===== sport summary grid ===== */
.spg{display:grid;grid-template-columns:repeat(2,1fr);gap:7px}
.sp{text-align:left;background:var(--card);border:1px solid var(--line);border-radius:11px;padding:9px 10px;position:relative}
.sp .n1{display:flex;align-items:center;justify-content:space-between;gap:6px}
.sp .nm{font-size:14px;font-weight:700;letter-spacing:-.02em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sp .ct{flex:none;font-size:11px;font-weight:700;color:var(--pri);background:var(--pri-s);border-radius:999px;padding:1px 7px}
.sp .n2{font-size:11.5px;color:var(--mut);margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sp .n3{display:flex;gap:3px;margin-top:5px}
.cls{font-size:10px;font-weight:700;border-radius:4px;padding:1px 5px;background:#eef2f7;color:#5c6878}
.cls.m{background:#e8f0ff;color:#1b45b8}.cls.f{background:#ffeef3;color:#be185d}
.sp.on{border-color:var(--navy);background:#f7f9ff;box-shadow:inset 0 0 0 1px var(--navy)}
.sp.ext::after{content:"제주 외";position:absolute;right:9px;bottom:9px;font-size:9.5px;font-weight:700;color:var(--warn)}

/* ===== day stats + sport chips ===== */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin:2px 0 10px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:11px;padding:10px 11px}
.stat .k{font-size:11px;font-weight:600;color:var(--mut)}
.stat .v{font-size:20px;font-weight:800;letter-spacing:-.03em;margin-top:3px}
.stat .v em{font-style:normal;font-size:11.5px;font-weight:700;color:var(--mut2);margin-left:3px}
.spbox{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:8px}
.sprow{display:flex;flex-wrap:wrap;gap:6px}
.spc{border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 11px;font-size:12.5px;
  font-weight:600;color:#44505f;display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
.spc .n{font-size:10.5px;font-weight:700;color:var(--mut2)}
.spc.on{background:var(--navy);border-color:var(--navy);color:#fff}
.spc.on .n{color:#a9c0f5}
.spinfo{display:flex;flex-wrap:wrap;align-items:center;gap:7px;margin-top:8px;padding:9px 11px;
  background:#f7f9ff;border:1px solid #dbe4fb;border-radius:11px;font-size:11.5px;color:#49535f}
.spinfo b{font-size:13px;color:var(--navy);letter-spacing:-.02em}
.spinfo .sep{width:1px;height:10px;background:#c9d6f5}
.spinfo .rst{margin-left:auto;font-size:11.5px;font-weight:700;color:var(--pri)}

/* ===== game item ===== */
.gi{display:flex;gap:10px;padding:11px 12px;border-bottom:1px solid var(--line2);align-items:flex-start}
.gi:last-child{border-bottom:0}
.gi .tm{flex:none;width:44px;font-size:13px;font-weight:700;color:var(--pri);font-variant-numeric:tabular-nums;padding-top:1px}
.gi .tm.tbd{color:var(--mut2);font-size:11.5px;font-weight:600}
.gi .bd{flex:1;min-width:0}
.gi .l1{display:flex;align-items:center;gap:5px;flex-wrap:wrap}
.gi .sn{font-size:14.5px;font-weight:700;letter-spacing:-.02em}
.gi .ev{font-size:12.5px;color:#49535f;margin-top:2px;font-weight:500}
.gi .wh{font-size:12.5px;color:var(--fg);margin-top:3px;font-weight:600}
.gi .vs{color:var(--dang);font-weight:700}
.gi .pl{font-size:11.5px;color:var(--mut);margin-top:3px;display:flex;align-items:center;gap:4px}
.gi .pl .dot{width:3px;height:3px;border-radius:50%;background:var(--mut2);flex:none}
.star{flex:none;width:30px;height:30px;display:flex;align-items:center;justify-content:center;
  font-size:17px;color:#d4d8de;margin:-3px -3px 0 0}
.star.on{color:#f59e0b}

/* ===== group tab ===== */
.gcard{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:13px}
.gcard .gh{display:flex;align-items:center;gap:7px}
.gcard .gn{font-size:16px;font-weight:800;letter-spacing:-.02em}
.gcard .car{font-size:11px;font-weight:700;background:var(--navy);color:#fff;border-radius:5px;padding:2px 7px}
.gcard .ar{font-size:13px;color:#3d4756;margin-top:6px;font-weight:600}
.gcard .mn{font-size:12px;color:var(--mut);margin-top:5px;line-height:1.55}
.rday{background:var(--card);border:1px solid var(--line);border-radius:var(--r);margin-top:9px;overflow:hidden}
.rday .rh{display:flex;align-items:center;gap:7px;padding:10px 13px;border-bottom:1px solid var(--line2);background:#fafbfc}
.rday .rh b{font-size:13.5px}
.rday .rh .dt{font-size:12px;color:var(--mut);font-weight:600}
.rday .rb{padding:11px 13px 12px}
.step{display:flex;gap:9px;position:relative;padding-bottom:11px}
.step:last-child{padding-bottom:0}
.step .ix{flex:none;width:19px;height:19px;border-radius:50%;background:var(--pri-s);color:var(--pri);
  font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center;margin-top:1px;z-index:1}
.step .ln{position:absolute;left:9px;top:21px;bottom:1px;width:1.5px;background:#e3e8f2}
.step:last-child .ln{display:none}
.step .sv{font-size:13.5px;font-weight:700;letter-spacing:-.015em}
.step .sd{font-size:12px;color:#4b5563;margin-top:2px}
.rnote{display:flex;gap:6px;margin-top:10px;padding-top:9px;border-top:1px dashed var(--line);
  font-size:12px;color:var(--mut);line-height:1.5}
.rnote b{color:#4b5563;flex:none;font-weight:700}
.rbtn{display:block;width:100%;margin-top:10px;padding:9px;border:1px solid var(--line);
  border-radius:9px;font-size:12.5px;font-weight:700;color:var(--pri);background:#fff}
.reftb{width:100%;border-collapse:collapse;font-size:12px}
.reftb th{background:#fafbfc;color:#5b6675;font-weight:700;text-align:left;padding:7px 10px;border-bottom:1px solid var(--line)}
.reftb td{padding:8px 10px;border-bottom:1px solid var(--line2);color:#3d4756}
.reftb tr:last-child td{border-bottom:0}
.reftb td:first-child{font-weight:700;color:var(--fg);white-space:nowrap}

/* ===== bottom bar + sheet ===== */
.fab{position:fixed;left:0;right:0;bottom:0;z-index:45;padding:9px 14px calc(9px + var(--safe-b));
  background:rgba(245,246,248,.93);backdrop-filter:blur(10px);border-top:1px solid var(--line)}
.fab button{width:100%;background:var(--navy);color:#fff;border-radius:12px;padding:13px;
  font-size:14.5px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:7px}
.ovl{position:fixed;inset:0;z-index:50;background:rgba(10,15,30,.44);opacity:0;pointer-events:none;transition:opacity .22s}
.ovl.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:51;background:var(--bg);
  border-radius:18px 18px 0 0;max-height:86vh;display:flex;flex-direction:column;
  transform:translateY(100%);transition:transform .26s cubic-bezier(.32,.72,0,1)}
.sheet.on{transform:translateY(0)}
.sheet .sh{padding:8px 16px 10px;border-bottom:1px solid var(--line);background:var(--card);border-radius:18px 18px 0 0}
.sheet .grab{width:38px;height:4px;background:#d7dbe2;border-radius:3px;margin:0 auto 9px}
.sheet .st{display:flex;align-items:center;justify-content:space-between}
.sheet .st b{font-size:15.5px}
.sheet .st button{font-size:13px;color:var(--mut);font-weight:600}
.sheet .sc{overflow-y:auto;-webkit-overflow-scrolling:touch;padding:11px 14px calc(16px + var(--safe-b))}
.vn{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:11px 12px}
.vn+.vn{margin-top:7px}
.vn .v1{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
.vn .vnm{font-size:14px;font-weight:700;letter-spacing:-.015em}
.vn .vg{flex:none;font-size:10.5px;font-weight:700;border-radius:5px;padding:2px 6px;background:#eef1f6;color:#5b6675}
.vn .vg.g1{background:#e8f0ff;color:#1b45b8}.vn .vg.g2{background:#e9f7ef;color:#047857}
.vn .vg.g3{background:#fff1e6;color:#b45309}.vn .vg.g4{background:#f3eaff;color:#6d28d9}
.vn .vg.ge{background:#fef2f2;color:#b91c1c}
.vn .vs2{font-size:11.5px;color:var(--mut);margin-top:3px;line-height:1.5}
.vn .vb{display:flex;gap:6px;margin-top:9px}
.vn .vb a,.vn .vb button{flex:1;text-align:center;border:1px solid var(--line);border-radius:8px;
  padding:7px 0;font-size:12px;font-weight:700;color:#44505f;background:#fff}
.vn .vb .go{background:var(--navy);border-color:var(--navy);color:#fff}
.note{font-size:11.5px;color:var(--mut2);line-height:1.6;padding:14px 4px 4px}
@media (prefers-color-scheme:dark){
 :root{--bg:#0e1116;--card:#171b22;--line:#262c36;--line2:#1f242c;--fg:#e9ecf1;--mut:#9aa3b2;--mut2:#6f7889;
   --pri:#7aa2ff;--pri-s:#1a2340;--warn-bg:#241c0c;--warn-line:#4a3a16;--warn:#f0b354}
 .seg{background:#1f242c}.seg button.on{background:#333b47;color:#fff}
 .dhd .dw{background:#4b5563}
 .fab{background:rgba(14,17,22,.92)}
 .rday .rh{background:#1b2029}
 .reftb th{background:#1b2029;color:#9aa3b2}
 .tag{background:#242a33;color:#aab3c0}
 .cls{background:#242a33;color:#aab3c0}.cls.m{background:#1a2340;color:#9fbcff}.cls.f{background:#3a1b2a;color:#ffa8c9}
 .sp.on{background:#1a2030}
 .vn .vb a,.vn .vb button{background:#1f242c}
 .chip{color:#aab3c0}
 .srch input{color:var(--fg)}
}
</style>
</head>
<body>
<div class="bar">
  <div class="t1">BUSAN · 제107회 전국체육대회 · 제주</div>
  <div class="t2"><h1>부산광역시 선수단 일정</h1><div class="dday" id="dday"></div></div>
</div>
<nav class="tabs">
  <button data-tab="ops" class="on">운영 일정<span class="nb" id="nb-ops"></span></button>
  <button data-tab="games">경기 일정<span class="nb" id="nb-gms"></span></button>
  <button data-tab="grp">조별 일정<span class="nb">4</span></button>
</nav>
<div id="filters"></div>
<main class="wrap" id="main"></main>

<div class="fab"><button id="openMap">
  <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>
  경기장 지도 · 길찾기</button></div>
<div class="ovl" id="ovl"></div>
<div class="sheet" id="sheet">
  <div class="sh"><div class="grab"></div>
    <div class="st"><b>경기장 · 길찾기</b><button id="closeMap">닫기</button></div>
    <div class="row" id="vfilter" style="padding:9px 0 1px"></div>
  </div>
  <div class="sc" id="vlist"></div>

        (S.gGroup?'<button class="chip on" data-gg="">'+esc(S.gGroup)+' 권역 &times;</button>':'')+
      '</div>'+
      '<div class="srch"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>'+
      '<input id="q" placeholder="종목·선수·학교·경기장 검색" value="'+esc(S.q)+'">'+(S.q?'<button class="clr" id="qc">&times;</button>':'')+'</div>'+
    '</div>';
  } else {
    F.innerHTML='<div class="sticky"><div class="seg">'+
      D.groups.map(g=>'<button data-grp="'+g.g+'" class="'+(S.grp===g.g?"on":"")+'">'+g.g+'</button>').join("")+
      '</div></div>';
  }
}

/* ---------- ops ---------- */
function viewOps(){
  const q=S.q.trim().toLowerCase();
  let L=D.ops.filter(o=>(S.opsCat==="all"||o.cat===S.opsCat)&&(S.opsDate==="all"||o.date===S.opsDate));
  if(q) L=L.filter(o=>[o.title,o.place,o.who,o.note,o.time].some(x=>x&&String(x).toLowerCase().includes(q)));
  if(!L.length) return '<div class="empty">조건에 맞는 일정이 없습니다.</div>';
  L.sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:a.seq-b.seq);
  let h="", cur="";
  L.forEach((o,i)=>{
    if(o.date!==cur){
      if(cur) h+='</div>';
      cur=o.date;
      const n=L.filter(x=>x.date===cur).length;
      const dn=L.find(x=>x.date===cur&&x.dnote);
      h+='<div class="dhd"><b>'+fd(o.date)+'</b><span class="dw '+(DOWC[o.dow]||"")+'">'+o.dow+'</span>'+
         (o.end&&o.end!==o.date?'<span class="cnt">~ '+fd(o.end)+'</span>':'')+
         '<div class="ln"></div><span class="cnt">'+n+'건</span></div>';
      if(dn&&dn.dnote) h+='<div class="warnbox"><span>!</span><span>'+esc(dn.dnote)+'</span></div>';
      h+='<div class="card">';
    }
    const off=o.status&&o.status!=="정상";
    h+='<div class="op'+(off?" off":"")+'">'+
       '<div class="tm">'+(o.time&&o.time!=="미정"?esc(o.time).replace("~","<small>~")+(String(o.time).includes("~")?"</small>":""):'<small style="display:block">미정</small>')+'</div>'+
       '<div class="bd"><div class="ti">'+esc(o.title)+'</div>'+
       (o.place?'<div class="pl">'+esc(o.place)+'</div>':'')+
       '<div class="mt">'+
         '<span class="tag">'+esc(o.cat)+'</span>'+
         (o.who?'<span class="tag who">'+esc(o.who)+'</span>':'')+
         (o.note?'<span class="tag nt">'+esc(o.note)+'</span>':'')+
         (off?'<span class="tag cx">'+esc(o.status)+'</span>':'')+
       '</div></div></div>';
  });
  return h+'</div>';
}

/* ---------- games ---------- */
function gFilterBase(){
  let L=D.games.filter(g=>S.gDate==="all"||g.date===S.gDate);
  if(S.gGroup){ const vs=D.venues.filter(v=>v.g===S.gGroup).map(v=>v.name); L=L.filter(g=>vs.includes(g.v)); }
  if(S.gFav) L=L.filter(g=>FAV.includes(g.id));
  const q=S.q.trim().toLowerCase();
  if(q) L=L.filter(g=>[g.sp,g.ev,g.who,g.vs,g.v,g.cls].some(x=>x&&String(x).toLowerCase().includes(q)));
  return L;
}
function sportSummary(L){
  const m={};
  L.forEach(g=>{
    const k=g.sp;
    if(!m[k]) m[k]={sp:k,n:0,cls:[],t:"99:99",v:[]};
    m[k].n++;
    if(g.cls&&!m[k].cls.includes(g.cls)) m[k].cls.push(g.cls);
    const t=tkey(g.t); if(t<m[k].t) m[k].t=t;
    if(!m[k].v.includes(g.v)) m[k].v.push(g.v);
  });
  return Object.values(m).sort((a,b)=>a.t<b.t?-1:a.t>b.t?1:a.sp.localeCompare(b.sp,"ko"));
}
function viewGames(){
  const L0=gFilterBase();
  const sum=sportSummary(L0);
  let h="";
  if(sum.length){
    const vn=new Set(L0.map(g=>g.v)).size;
    const lab=S.gDate==="all"?"전체 기간":DAYN[S.gDate]+"일차 "+fdw(S.gDate);
    h+='<div class="sechd"><h2>'+lab+' 한눈에 보기</h2><span>종목을 누르면 그 종목 경기만 보입니다</span></div>';
    h+='<div class="stats">'+
       '<div class="stat"><div class="k">경기 수</div><div class="v">'+L0.length+'<em>경기</em></div></div>'+
       '<div class="stat"><div class="k">출전 종목</div><div class="v">'+sum.length+'<em>종목</em></div></div>'+
       '<div class="stat"><div class="k">경기 장소</div><div class="v">'+vn+'<em>곳</em></div></div>'+
     '</div>';
    h+='<div class="spbox"><div class="sprow">'+
       '<button class="spc'+(S.gSport?"":" on")+'" data-gs="">전체<span class="n">'+L0.length+'</span></button>'+
       sum.map(x=>'<button class="spc'+(S.gSport===x.sp?" on":"")+'" data-sp="'+esc(x.sp)+'">'+esc(x.sp)+'<span class="n">'+x.n+'</span></button>').join("")+
     '</div></div>';
    const sel=S.gSport?sum.find(x=>x.sp===S.gSport):null;
    if(sel){
      h+='<div class="spinfo"><b>'+esc(sel.sp)+'</b>'+
         '<span class="sep"></span><span>'+(sel.t==="99:99"?"시간 미정":"첫 경기 "+sel.t)+'</span>'+
         '<span class="sep"></span><span>'+esc(sel.v[0])+(sel.v.length>1?" 외 "+(sel.v.length-1)+"곳":"")+'</span>'+
         sel.cls.map(c=>'<span class="cls '+(c==="남"?"m":c==="여"?"f":"")+'">'+esc(c)+'</span>').join("")+
         (sel.v.every(EXTV)?'<span class="cls" style="background:#fff7ed;color:#b45309">제주 외</span>':'')+
         '<button class="rst" data-gs="">전체 종목 보기</button></div>';
    }
  }
  let L=S.gSport?L0.filter(g=>g.sp===S.gSport):L0;
  if(!L.length) return h+'<div class="empty" style="margin-top:12px">조건에 맞는 경기가 없습니다.</div>';
  L.sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:tkey(a.t)<tkey(b.t)?-1:tkey(a.t)>tkey(b.t)?1:a.sp.localeCompare(b.sp,"ko"));
  h+='<div class="sechd" id="glist"><h2>'+(S.gSport?esc(S.gSport)+" 경기 일정":"전체 경기 일정")+'</h2><span>'+L.length+'경기</span></div>';
  let cur="";
  L.forEach(g=>{
    if(g.date!==cur){
      if(cur) h+='</div>';
      cur=g.date;
      const n=L.filter(x=>x.date===cur).length;
      h+='<div class="dhd"><b>'+DAYN[cur]+'일차 '+fd(cur)+'</b><span class="dw '+(DOWC[g.dow]||"")+'">'+g.dow+'</span><div class="ln"></div><span class="cnt">'+n+'경기</span></div><div class="card">';
    }
    const tbd=!g.t||g.t==="미정";
    h+='<div class="gi">'+
      '<div class="tm'+(tbd?" tbd":"")+'">'+(tbd?"미정":esc(g.t))+'</div>'+
      '<div class="bd"><div class="l1"><span class="sn">'+esc(g.sp)+'</span>'+
        (g.cls?'<span class="cls '+(g.cls==="남"?"m":g.cls==="여"?"f":"")+'">'+esc(g.cls)+'</span>':'')+
        (EXTV(g.v)?'<span class="cls" style="background:#fff7ed;color:#b45309">제주 외</span>':'')+'</div>'+
        (g.ev?'<div class="ev">'+esc(g.ev)+'</div>':'')+
        (g.who?'<div class="wh">'+esc(g.who)+(g.vs?' <span class="vs">vs '+esc(g.vs)+'</span>':'')+'</div>':'')+
        '<div class="pl"><span class="dot"></span>'+esc(g.v)+'</div>'+
      '</div><button class="star'+(FAV.includes(g.id)?" on":"")+'" data-fav="'+g.id+'">'+(FAV.includes(g.id)?"★":"☆")+'</button>'+
    '</div>';
  });
  return h+'</div>';
}

/* ---------- groups ---------- */
function steps(route){
  return route.split(/\s*(?:→|↔)\s*/).map(s=>{
    const m=s.match(/^(.*?)〔(.*)〕\s*$/);
    return m?{v:m[1].trim(),d:m[2]}:{v:s.trim(),d:""};
  });
}
function viewGrp(){
  const G=D.groups.find(x=>x.g===S.grp);
  let h='<div class="gcard"><div class="gh"><span class="gn">'+G.g+'</span><span class="car">'+G.car+'</span></div>'+
    '<div class="ar">'+esc(G.area)+'</div><div class="mn">주요 경기장 · '+esc(G.main)+'</div></div>';
  h+='<div class="sechd"><h2>일일 이동 동선</h2><span>7일 · 10.16~10.22</span></div>';
  D.routes.forEach(day=>{
    const r=day.rows.find(x=>x.g===S.grp); if(!r) return;
    const st=steps(r.route);
    h+='<div class="rday"><div class="rh"><b>'+day.d+'일차</b><span class="dt">'+fdw(day.date)+'</span>'+
       '<div class="ln" style="flex:1"></div><span class="dt">'+st.length+'개 지점</span></div><div class="rb">';
    if(day.dnote) h+='<div class="warnbox" style="margin-bottom:10px"><span>!</span><span>'+esc(day.dnote)+'</span></div>';
    st.forEach((s,i)=>{
      h+='<div class="step"><div class="ln"></div><div class="ix">'+(i+1)+'</div><div>'+
         '<div class="sv">'+esc(s.v)+'</div>'+(s.d?'<div class="sd">'+esc(s.d)+'</div>':'')+'</div></div>';
    });
    if(r.note) h+='<div class="rnote"><b>비고</b><span>'+esc(r.note)+'</span></div>';
    h+='<button class="rbtn" data-go="'+day.date+'">이 날 '+S.grp+' 권역 경기 보기</button>';
    h+='</div></div>';
  });
  h+='<div class="sechd"><h2>참고 · 사전경기로 빠진 제주 개최 종목</h2><span>4종목</span></div>'+
     '<div class="card"><table class="reftb"><tr><th>종목</th><th>기간</th><th>경기장</th></tr>'+
     D.pre.map(p=>'<tr><td>'+esc(p.sp)+'</td><td>'+esc(p.p)+'</td><td>'+esc(p.v)+(p.n&&p.n!=="-"?'<br><span style="color:#b45309;font-size:11px">'+esc(p.n)+'</span>':'')+'</td></tr>').join("")+'</table></div>';
  h+='<div class="sechd"><h2>참고 · 제주 외 지역 개최 종목</h2><span>5종목</span></div>'+
     '<div class="card"><table class="reftb"><tr><th>종목</th><th>개최지</th></tr>'+
     D.ext.map(p=>'<tr><td>'+esc(p.sp)+'</td><td>'+esc(p.v)+(p.n&&p.n!=="-"?'<br><span style="color:#6b7280;font-size:11px">'+esc(p.n)+'</span>':'')+'</td></tr>').join("")+'</table></div>';
  h+='<div class="note">출처 · 제107회 전국체육대회 일일 조별 이동 동선(안). 차량 4대 기준, 편람 주요 경기 일정(27~40쪽) 참고.</div>';
  return h;
}

/* ---------- venue sheet ---------- */
function renderVenues(){
  const tabs=[["all","전체"],["1조","1조 권역"],["2조","2조 권역"],["3조","3조 권역"],["4조","4조 권역"],["타지역","제주 외"]];
  document.getElementById("vfilter").innerHTML=tabs.map(t=>{
    const n=t[0]==="all"?D.venues.length:D.venues.filter(v=>v.g===t[0]).length;
    return '<button class="chip '+(S.vg===t[0]?"on":"")+'" data-vg="'+t[0]+'">'+t[1]+'<span class="n">'+n+'</span></button>';
  }).join("");
  const L=D.venues.filter(v=>S.vg==="all"||v.g===S.vg);
  document.getElementById("vlist").innerHTML=L.map(v=>{
    const q=encodeURIComponent(v.name);
    return '<div class="vn"><div class="v1"><span class="vnm">'+esc(v.name)+'</span><span class="vg '+GC[v.g]+'">'+esc(v.g==="타지역"?"제주 외":v.g)+'</span></div>'+
      '<div class="vs2">'+v.n+'경기 · '+esc(v.sp.join(", "))+'</div>'+
      '<div class="vb"><a href="https://map.kakao.com/link/search/'+q+'" target="_blank" rel="noopener">카카오맵</a>'+
      '<a href="https://map.naver.com/p/search/'+q+'" target="_blank" rel="noopener">네이버지도</a>'+
      '<button class="go" data-vgo="'+esc(v.name)+'">경기 보기</button></div></div>';
  }).join("")+'<div class="note">경기장명으로 지도 앱에서 검색됩니다. 동명 시설이 있을 수 있으니 출발 전 위치를 확인해 주세요.</div>';
}

/* ---------- render ---------- */
function render(){
  document.querySelectorAll(".tabs button").forEach(b=>b.classList.toggle("on",b.dataset.tab===S.tab));
  renderFilters();
  document.getElementById("main").innerHTML = S.tab==="ops"?viewOps():S.tab==="games"?viewGames():viewGrp();
}
function toTop(){ window.scrollTo({top:0}); }

document.addEventListener("click",e=>{
  const t=e.target.closest("[data-tab],[data-oc],[data-od],[data-gd],[data-sp],[data-gf],[data-gs],[data-gg],[data-grp],[data-go],[data-fav],[data-vg],[data-vgo],#qc");
  if(!t) return;
  const d=t.dataset;
  if(d.tab!==undefined){ S.tab=d.tab; S.q=""; render(); toTop(); }
  else if(d.oc!==undefined){ S.opsCat=d.oc; S.opsDate="all"; render(); }
  else if(d.od!==undefined){ S.opsDate=d.od; render(); }
  else if(d.gd!==undefined){ S.gDate=d.gd; S.gSport=null; render(); }
  else if(d.sp!==undefined){ S.gSport=(S.gSport===d.sp?null:d.sp); render();
    const el=document.getElementById("glist");
    if(el&&S.gSport){ const y=el.getBoundingClientRect().top+window.scrollY-120; window.scrollTo({top:y>0?y:0,behavior:"smooth"}); } }
  else if(d.gf!==undefined){ S.gFav=!S.gFav; S.gSport=null; render(); }
  else if(d.gs!==undefined){ S.gSport=null; render(); }
  else if(d.gg!==undefined){ S.gGroup=null; render(); }
  else if(d.grp!==undefined){ S.grp=d.grp; render(); toTop(); }
  else if(d.go!==undefined){ S.tab="games"; S.gDate=d.go; S.gGroup=S.grp; S.gSport=null; S.gFav=false; S.q=""; render(); toTop(); }
  else if(d.fav!==undefined){ const i=FAV.indexOf(d.fav); i<0?FAV.push(d.fav):FAV.splice(i,1); saveFav();
    t.classList.toggle("on"); t.textContent=t.classList.contains("on")?"★":"☆";
    const c=document.querySelector('[data-gf] .n'); if(c) c.textContent=FAV.length;
    if(S.gFav) render(); }
  else if(d.vg!==undefined){ S.vg=d.vg; renderVenues(); document.getElementById("vlist").scrollTop=0; }
  else if(d.vgo!==undefined){ S.tab="games"; S.gDate="all"; S.gSport=null; S.gGroup=null; S.gFav=false; S.q=d.vgo; closeSheet(); render(); toTop(); }
  else if(t.id==="qc"){ S.q=""; render(); }
});
document.addEventListener("input",e=>{
  if(e.target.id!=="q") return;
  S.q=e.target.value;
  document.getElementById("main").innerHTML = S.tab==="ops"?viewOps():viewGames();
});
const ovl=document.getElementById("ovl"), sheet=document.getElementById("sheet");
function openSheet(){ renderVenues(); ovl.classList.add("on"); sheet.classList.add("on"); }
function closeSheet(){ ovl.classList.remove("on"); sheet.classList.remove("on"); }
document.getElementById("openMap").onclick=openSheet;
document.getElementById("closeMap").onclick=closeSheet;
ovl.onclick=closeSheet;

render();
</script>
</body>
</html>
